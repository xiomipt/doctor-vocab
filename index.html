<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor Vocab: dolores en inglés</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6f4;--card:#fff;--ink:#12333a;--mute:#4f7077;--teal:#0e7c86;--coral:#e8445a;--sun:#ffc93c;--ok:#157a49;--okbg:#d6f3e4;--badbg:#fde1e5;--line:#cfe4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f2227;--card:#17323a;--ink:#e6f4f2;--mute:#9ec0c3;--teal:#46c2cc;--coral:#ff6b80;--ok:#6fe0a4;--okbg:#14412c;--badbg:#4a1f2a;--line:#27484f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f2227;--card:#17323a;--ink:#e6f4f2;--mute:#9ec0c3;--teal:#46c2cc;--coral:#ff6b80;--ok:#6fe0a4;--okbg:#14412c;--badbg:#4a1f2a;--line:#27484f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hud{display:flex;gap:8px;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:600;font-size:15px}
.combo.hot{background:var(--sun);border-color:var(--sun);color:#3a2a00}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .4s}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;text-align:center}
.tbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;width:100%;background:var(--teal)}
.tbar i.low{background:var(--coral)}
.lab{margin:0;color:var(--mute);font-size:15px}
.em{font-size:76px;line-height:1.1;margin:6px 0}
h1{font-size:44px;line-height:1;margin:6px 0;color:var(--coral)}
h2{font-size:28px;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:18px;font-weight:500;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt b{display:grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--card);border:2px solid var(--line);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--coral);animation:shake .35s}
.opt:disabled{cursor:default}
.fb{min-height:24px;margin-top:12px;font-weight:600}
.fb small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.btn{font:inherit;font-weight:700;font-size:19px;color:#fff;background:var(--coral);border:0;border-bottom:5px solid #b32d41;border-radius:16px;padding:12px 26px;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--teal);border-bottom-color:#08565d}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps span{flex:1;display:grid;place-items:center;line-height:1.15;text-align:center;padding:6px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--mute);font-size:14px;font-weight:600}
.steps .on{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.steps .done{color:var(--ok);border-color:var(--ok)}
.steps.menu{flex-direction:column;gap:10px;margin:14px 0}
.steps button{font:inherit;font-weight:600;font-size:18px;padding:14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--bg);color:var(--ink);cursor:pointer}
.steps button:hover{border-color:var(--teal)}
.steps button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.back{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 14px;cursor:pointer;margin:0 0 10px}
.back:hover{border-color:var(--teal)}
.back:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fc{perspective:1000px;height:400px;cursor:pointer;border-radius:24px}
.fc:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.fc-b{transform:rotateY(180deg)}
.ex{font-size:18px;line-height:1.35;margin:8px 0}
.ex b{color:var(--coral)}
.nav{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.nav .btn,.nav .back{margin:0}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:20px;cursor:pointer}
.mus:hover{border-color:var(--teal)}
.mus:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;font-size:34px;margin:10px 0 14px;flex-wrap:wrap}
.miss{text-align:left;margin:12px 0 0;padding:0;list-style:none;font-size:16px}
.miss li{padding:6px 0;border-top:1px solid var(--line)}
.big{font-size:52px;font-weight:700;color:var(--teal);line-height:1}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}.opt.bad{animation:none}.conf{display:none}.prog i{transition:none}}
</style></head>
<body><main id="app"></main>
<button id="mus" class="mus" aria-label="Sonidos" aria-pressed="true">🔊</button>
<script>
const W=[
["Headache","Dolor de cabeza","🤕","My head hurts. I have a …",""],
["Toothache","Dolor de muelas","🦷","My tooth hurts. I have a …",""],
["Stomachache","Dolor de estómago","🤢","My stomach hurts. I have a …",""],
["Backache","Dolor de espalda","🧍","My back hurts. I have a …",""],
["Earache","Dolor de oídos","👂","My ear hurts. I have an …","También se dice otitis."],
["Sore throat","Dolor de garganta","🗣️","My throat hurts. I have a …",""],
["Stiff neck","Dolor de cuello","🙆","My neck hurts and I cannot turn it. I have a …","También se dice tortícolis."]
].map(a=>({en:a[0],es:a[1],em:a[2],s:a[3],n:a[4]}));
const EX={
"Headache":["I took a pill for my <b>headache</b>.","This loud music gives me a <b>headache</b>."],
"Toothache":["She went to the dentist because of a <b>toothache</b>.","I cannot sleep with this <b>toothache</b>."],
"Stomachache":["He ate too much and got a <b>stomachache</b>.","My little brother has a <b>stomachache</b>."],
"Backache":["Sitting all day gives me a <b>backache</b>.","My grandfather has a <b>backache</b>."],
"Earache":["The child cried because of an <b>earache</b>.","I had an <b>earache</b> after swimming."],
"Sore throat":["I have a <b>sore throat</b> and a cough.","Warm tea is good for a <b>sore throat</b>."],
"Stiff neck":["I woke up with a <b>stiff neck</b>.","Bad posture can cause a <b>stiff neck</b>."]};
const app=document.getElementById('app'),TIME=10000;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mult=()=>Math.min(3,1+Math.floor(S.st/3));
let S,best=0;
const steps=(n,m)=>`${m?'':'<button class="back" id="bk">← Menú</button>'}<div class="steps${m?' menu':''}">${['Aprender vocabulario','Practicar vocabulario','Completar oraciones'].map((t,k)=>m?`<button data-s="${k}">${t}</button>`:`<span class="${k===n?'on':k<n?'done':''}">${k<n?'✓ ':''}${t}</span>`).join('')}</div>`;
try{best=+localStorage.getItem('dv-best')||0}catch(e){}
function mk(w,t){
 const o=sh([w,...sh(W.filter(x=>x!==w)).slice(0,3)]).map(x=>t===0?x.es:x.en);
 const q={w,o,a:t===0?w.es:w.en,em:w.em};
 if(t===0){q.lab='¿Qué significa?';q.h=w.en}
 else if(t===1){q.lab='¿Cómo se dice en inglés?';q.h=w.es}
 else{q.lab='Completa la frase';q.h=w.s}
 return q}
function home(){
 app.innerHTML=`<div class="wrap"><div class="card"><div class="row">${W.map(w=>w.em).join('')}</div>
 <h1>Doctor Vocab</h1><p class="lab">Dolores en inglés</p>
 ${steps(-1,1)}<p class="lab">Toca una opción para empezar.</p>
 ${best?`<p class="lab">Tu récord: ⭐ ${best}</p>`:''}</div></div>`;
 app.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>[learn,practice,game][+b.dataset.s]());
}
function learn(){let i=0;
 const draw=()=>{const w=W[i],x=EX[w.en],last=i===W.length-1;
  app.innerHTML=`<div class="wrap">${steps(0)}<div class="hud"><span class="pill">Palabra ${i+1}/${W.length}</span></div><div class="prog"><i style="width:${i/W.length*100}%"></i></div>
 <div class="fc" id="fc" tabindex="0" role="button" aria-label="Voltear la tarjeta"><div class="fc-in"><div class="fc-f"><div class="em">${w.em}</div><h1>${w.en}</h1><p class="lab">Toca la tarjeta para ver el significado</p></div><div class="fc-b"><h2>${w.es}</h2><p class="ex">${x[0]}</p><p class="ex">${x[1]}</p>${w.n?`<p class="lab">${w.n}</p>`:''}</div></div></div>
 <div class="nav">${i>0?'<button class="back" id="pv">← Anterior</button>':''}<button class="btn alt" id="fl">${last?'Terminar':'Siguiente →'}</button></div></div>`;
  const fc=document.getElementById('fc'),flip=()=>fc.classList.toggle('flip');
  fc.onclick=flip;fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  document.getElementById('fl').onclick=()=>last?done('¡Repasaste las 7 palabras!','Repasar otra vez',learn):(i++,draw());
  const pv=document.getElementById('pv');if(pv)pv.onclick=()=>{i--;draw()};};
 draw()}
function done(t,l,fn){app.innerHTML=`<div class="wrap"><div class="card"><div class="em">🎉</div><h2>${t}</h2><button class="btn" id="d1">${l}</button><br><button class="btn alt" id="d2">Volver al menú</button></div></div>`;document.getElementById('d1').onclick=fn;document.getElementById('d2').onclick=home}
function practice(){S={q:sh(W).map(w=>mk(w,0)),i:0,sc:0,st:0,ok:0,bad:[],lock:false,m:'p'};show()}
function game(){app.innerHTML=`<div class="wrap">${steps(2)}<div class="card"><div class="em">⏱️</div><h2>Completa la oración</h2><p>7 pacientes, 10 segundos cada uno.<br>Encadena aciertos para subir el multiplicador.</p><button class="btn" id="g3">¡Vamos!</button></div></div>`;document.getElementById('g3').onclick=()=>start(sh(W).map(w=>mk(w,2)))}
function start(q){S={q,i:0,sc:0,st:0,ok:0,bad:[],lock:false};show()}
function show(){
 const q=S.q[S.i];S.lock=false;
 app.innerHTML=`<div class="wrap">${steps(S.m?1:2)}<div class="hud">${S.m?`<span class="pill">Pregunta ${S.i+1}/${S.q.length}</span>`:`<span class="pill">Oración ${S.i+1}/${S.q.length}</span><span class="pill combo ${S.st>=3?'hot':''}">🔥 ${S.st} · x${mult()}</span><span class="pill">⭐ ${S.sc}</span>`}</div>
 <div class="prog"><i style="width:${S.i/S.q.length*100}%"></i></div>
 <div class="card"><div class="tbar"><i id="tb"></i></div><p class="lab">${q.lab}</p><div class="em">${q.em}</div><h2>${q.h}</h2>
 <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><b>${k+1}</b>${t}</button>`).join('')}</div>
 <div id="fb" class="fb" aria-live="polite"></div></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
 if(S.m){document.querySelector('.tbar').style.visibility='hidden';return}
 const tb=document.getElementById('tb'),t0=performance.now();
 S.r=1;
 S.iv=setInterval(()=>{S.r=Math.max(0,1-(performance.now()-t0)/TIME);tb.style.width=S.r*100+'%';tb.className=S.r<.3?'low':'';if(S.r<=0)answer(-1)},50);
}
function answer(k){
 if(S.lock)return;
 if(S.m){const q=S.q[S.i],fb=document.getElementById('fb'),b=app.querySelectorAll('.opt')[k];
  if(q.o[k]===q.a){S.lock=true;app.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.o[j]===q.a)x.classList.add('ok')});fb.innerHTML='✅ ¡Muy bien!'+(q.w.n?`<small>${q.w.n}</small>`:'');S.to=setTimeout(next,q.w.n?1500:1000)}
  else{b.disabled=true;b.classList.add('bad');fb.textContent='Intenta otra vez 💪'}
  return}
 S.lock=true;clearInterval(S.iv);
 const q=S.q[S.i],ok=k>=0&&q.o[k]===q.a,fb=document.getElementById('fb');
 app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
 const note=q.w.n?`<small>${q.w.n}</small>`:'';
 if(ok){
  const pts=(100+Math.round(S.r*50))*mult();S.sc+=pts;S.st++;S.ok++;
  fb.innerHTML=`✅ ¡Exacto! +${pts}${note}`;
  S.to=setTimeout(next,note?1500:900);
 }else{
  S.st=0;if(!S.bad.includes(q.w))S.bad.push(q.w);
  fb.innerHTML=`${k<0?'⏰ Se acabó el tiempo.':'❌ Casi.'} Era: ${q.w.en} = ${q.w.es}${note}<br><button class="btn alt" id="nx">Siguiente</button>`;
  document.getElementById('nx').focus();document.getElementById('nx').onclick=next;
 }
}
function next(){S.i++;if(S.i<S.q.length)return show();S.m?done('¡Completaste la práctica!','Practicar otra vez',practice):end()}
function end(){
 const n=S.q.length,r=S.ok/n>=.9?['Doctor/a Honoris Causa','🏆']:S.ok/n>=.65?['Médico/a','🩺']:S.ok/n>=.4?['Enfermero/a','💉']:['Paciente en recuperación','🤒'];
 const rec=S.sc>best;if(rec){best=S.sc;try{localStorage.setItem('dv-best',best)}catch(e){}}
 app.innerHTML=`<div class="wrap"><div class="card"><div class="em">${r[1]}</div><h2>${r[0]}</h2>
 <div class="big">${S.ok}/${n}</div><p class="lab">aciertos</p>
 <p>⭐ ${S.sc} puntos${rec?' · ¡Nuevo récord!':best?` · Récord ${best}`:''}</p>
 ${S.bad.length?`<p class="lab">Para repasar:</p><ul class="miss">${S.bad.map(w=>`<li>${w.em} <b>${w.en}</b> = ${w.es}</li>`).join('')}</ul>`:'<p>¡Sin errores! 🎉</p>'}
 ${S.bad.length?'<button class="btn alt" id="rv">Repasar mis fallos</button><br>':''}
 <button class="btn" id="ag">Jugar otra vez</button><br><button class="btn alt" id="mn">Volver al menú</button></div></div>`;
 document.getElementById('ag').onclick=game;document.getElementById('mn').onclick=home;
 const rv=document.getElementById('rv');
 if(rv)rv.onclick=()=>start(sh(S.bad.flatMap(w=>[0,1,2].map(t=>[w,t]))).slice(0,12).map(p=>mk(...p)));
 if(S.ok/n>=.65&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  for(let i=0;i<24;i++){const s=document.createElement('span');s.className='conf';s.textContent=['🎉','⭐','💊','🩺'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}
 }
}
addEventListener('keydown',e=>{
 if(!S||!document.querySelector('.opt'))return;
 if(!S.lock&&/^[1-4]$/.test(e.key)){Sfx.click();answer(+e.key-1)}
});
let muted=false;try{muted=localStorage.getItem('dv-mus')==='0'}catch(e){}
const mb=document.getElementById('mus');
const upd=()=>{mb.textContent=muted?'🔇':'🔊';mb.setAttribute('aria-pressed',String(!muted));mb.title=muted?'Activar sonidos':'Silenciar sonidos'};
upd();
mb.onclick=()=>{muted=!muted;try{localStorage.setItem('dv-mus',muted?'0':'1')}catch(e){}upd()};
const Sfx=(()=>{let c;
 function beep(f1,f2,dur,vol){if(muted)return;try{if(!c)c=new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
 return{click:()=>beep(700,420,.09,.07),hover:()=>beep(900,1000,.05,.025)}})();
let un=false;
addEventListener('click',e=>{un=true;if(e.target.closest('button,.fc'))Sfx.click()},true);
addEventListener('pointerover',e=>{if(!un||e.pointerType!=='mouse')return;const b=e.target.closest('button:not(:disabled),.fc');if(!b||(e.relatedTarget&&b.contains(e.relatedTarget)))return;Sfx.hover()});
addEventListener('click',e=>{if(e.target.closest('#bk')){if(S){clearInterval(S.iv);clearTimeout(S.to)}home()}});
home();
</script></body></html>
